apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-catalog
  namespace: fcg-catalog
  labels:
    app.kubernetes.io/name: fcg-catalog
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fcg-catalog
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fcg-catalog
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: fcg-catalog-sa
      containers:
        - name: fcg-catalog
          image: fcgacrfiap2026.azurecr.io/fcg-catalog:main
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: fcg-catalog-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: fcg-catalog-secrets
                  key: ConnectionStrings__DefaultConnection
            - name: ConnectionStrings__MongoConnection
              valueFrom:
                secretKeyRef:
                  name: fcg-catalog-secrets
                  key: ConnectionStrings__MongoConnection
            - name: JwtSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: fcg-catalog-secrets
                  key: JwtSettings__SecretKey
            - name: KafkaSettings__SaslPassword
              valueFrom:
                secretKeyRef:
                  name: fcg-catalog-secrets
                  key: KafkaSettings__SaslPassword
            - name: RedisSettings__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: fcg-catalog-secrets
                  key: RedisSettings__ConnectionString
            - name: ElasticsearchSettings__Uri
              valueFrom:
                secretKeyRef:
                  name: fcg-catalog-secrets
                  key: ElasticsearchSettings__Uri
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: fcg-catalog-secrets

