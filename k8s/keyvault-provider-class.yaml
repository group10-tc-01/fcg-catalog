apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: fcg-catalog-secrets
  namespace: fcg-catalog
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "__AKS_KEYVAULT_CLIENT_ID__"
    keyvaultName: "__KEY_VAULT_NAME__"
    tenantId: "__AZURE_TENANT_ID__"
    objects: |
      array:
        - |
          objectName: sql-connection-catalog
          objectType: secret
        - |
          objectName: jwt-secret-key
          objectType: secret
        - |
          objectName: eventhub-connection
          objectType: secret
        - |
          objectName: mongodb-connection
          objectType: secret
        - |
          objectName: redis-connection
          objectType: secret
        - |
          objectName: elasticsearch-uri
          objectType: secret
  secretObjects:
    - secretName: fcg-catalog-secrets
      type: Opaque
      data:
        - objectName: sql-connection-catalog
          key: ConnectionStrings__DefaultConnection
        - objectName: jwt-secret-key
          key: JwtSettings__SecretKey
        - objectName: eventhub-connection
          key: KafkaSettings__SaslPassword
        - objectName: mongodb-connection
          key: ConnectionStrings__MongoConnection
        - objectName: redis-connection
          key: RedisSettings__ConnectionString
        - objectName: elasticsearch-uri
          key: ElasticsearchSettings__Uri

